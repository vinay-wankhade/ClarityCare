<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Clarity Care – Convert discharge notes into clear patient instruction sheets with nurse verification.">
    <title>Clarity Care – Discharge Instructions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- ─── Top Nav ──────────────────────────────────── -->
    <nav class="top-nav" id="top-nav">
        <div class="nav-brand">
            <div class="nav-icon">
                <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                    <rect x="2" y="10" width="24" height="8" rx="2" fill="url(#grad1)"/>
                    <rect x="10" y="2" width="8" height="24" rx="2" fill="url(#grad1)"/>
                    <defs>
                        <linearGradient id="grad1" x1="0" y1="0" x2="28" y2="28">
                            <stop offset="0%" stop-color="#60a5fa"/>
                            <stop offset="100%" stop-color="#a78bfa"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <span class="brand-text">Clarity Care</span>
        </div>
        <div class="nav-status" id="nav-status">
            <span class="status-dot"></span>
            <span class="status-text">Ready</span>
        </div>
    </nav>

    <!-- ─── Main Content ────────────────────────────── -->
    <main class="main-container" id="main-container">

        <!-- ─── Input Panel ──────────────────────────── -->
        <section class="panel input-panel glass" id="input-panel">
            <div class="panel-header">
                <h1 class="panel-title">
                    <span class="title-icon">📋</span>
                    Discharge Note Input
                </h1>
                <p class="panel-subtitle">Paste the clinician's raw discharge note below</p>
            </div>

            <div class="form-group">
                <label for="patient-ref" class="form-label">Patient Reference</label>
                <input
                    type="text"
                    id="patient-ref"
                    class="form-input"
                    placeholder="e.g. PT-2024-0847"
                    autocomplete="off"
                >
            </div>

            <div class="form-group">
                <label for="raw-note" class="form-label">Raw Discharge Note</label>
                <textarea
                    id="raw-note"
                    class="form-textarea"
                    rows="14"
                    placeholder="Paste the discharge note here...

Example:
Dx: CHF exacerbation. Start Lasix 40mg PO BID. Continue Metoprolol 25mg PO QD. Hold Lisinopril 10mg. Diet: 2g Na, 1.5L fluid restriction. F/u cardiology in 5-7 days. ER if SOB, weight gain >3lbs/day, CP."
                ></textarea>
                <div class="char-count" id="char-count">0 characters</div>
            </div>

            <button class="btn btn-primary" id="btn-process" type="button">
                <span class="btn-icon">⚡</span>
                Process Note
                <span class="btn-loader" id="btn-loader"></span>
            </button>

            <div class="sample-note-link">
                <button class="btn-text" id="btn-sample" type="button">Load sample discharge note</button>
            </div>
        </section>

        <!-- ─── Results Panel (hidden until processed) ──── -->
        <section class="panel results-panel glass hidden" id="results-panel">

            <!-- Guardrail Warning Banner -->
            <div class="guardrail-banner hidden" id="guardrail-banner">
                <div class="banner-icon">🛡️</div>
                <div class="banner-content">
                    <strong>Guardrail Alert</strong>
                    <p id="guardrail-message"></p>
                    <ul id="guardrail-list"></ul>
                </div>
                <button class="btn-banner-ack hidden" id="btn-ack-guardrail" type="button">
                    Acknowledge & Continue
                </button>
            </div>

            <!-- Status Badge -->
            <div class="record-header" id="record-header">
                <div class="record-info">
                    <span class="record-label">Record</span>
                    <span class="record-id" id="record-id-display">#—</span>
                </div>
                <div class="status-badge" id="status-badge">pending</div>
            </div>

            <!-- Tab Navigation -->
            <div class="tab-nav" id="tab-nav">
                <button class="tab active" data-tab="patient-view" id="tab-patient">
                    <span class="tab-icon">💊</span> Patient View
                </button>
                <button class="tab" data-tab="extracted-data" id="tab-extracted">
                    <span class="tab-icon">🔬</span> Extracted Data
                </button>
                <button class="tab" data-tab="audit-trail" id="tab-audit">
                    <span class="tab-icon">✅</span> Audit Trail
                    <span class="audit-count" id="audit-count"></span>
                </button>
            </div>

            <!-- Tab Content: Patient View -->
            <div class="tab-content active" id="content-patient-view">
                <div id="patient-instructions"></div>
            </div>

            <!-- Tab Content: Extracted Data -->
            <div class="tab-content" id="content-extracted-data">
                <div id="extracted-data-view"></div>
            </div>

            <!-- Tab Content: Audit Trail -->
            <div class="tab-content" id="content-audit-trail">
                <div id="audit-list"></div>
            </div>

            <!-- Action Buttons -->
            <div class="action-bar" id="action-bar">
                <button class="btn btn-success" id="btn-verify" type="button" disabled>
                    <span class="btn-icon">✓</span> Verify as Nurse
                </button>
                <button class="btn btn-export" id="btn-export" type="button" disabled>
                    <span class="btn-icon">📄</span> Export PDF
                </button>
                <button class="btn btn-secondary" id="btn-new" type="button">
                    <span class="btn-icon">+</span> New Note
                </button>
            </div>
        </section>
    </main>

    <!-- ─── Toast Container ──────────────────────────── -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/app.js"></script>
</body>
</html>
